# Hostless app config for the existing backend deployment.
# Use repository-relative paths so the build can see hostless-backend and hostless-proxy.
working_directory: "."
build_context_directory: "."

build:
  system: auto
  command: "corepack pnpm --dir hostless-backend install"

start_command: "npm --prefix hostless-backend start"

health_check:
  type: http
  http_path: /healthz
