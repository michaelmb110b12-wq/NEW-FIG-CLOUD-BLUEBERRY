# Hostless app config for the existing backend deployment.
# Keep the repository root in the build context so hostless-proxy/public is included.
working_directory: "/"
build_context_directory: "/"

build:
  system: auto
  command: "npm --prefix hostless-backend install"

start_command: "npm --prefix hostless-backend start"

health_check:
  type: http
  http_path: /healthz
